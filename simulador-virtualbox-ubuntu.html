<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador VirtualBox + Ubuntu — Instalação e Configuração</title>
<style>
  :root {
    --bg: #0a0e14;
    --bg-card: rgba(20, 26, 36, 0.7);
    --bg-card-solid: #141a24;
    --fg: #e6edf3;
    --fg-muted: #8b949e;
    --border: #21262d;
    --primary: #dd4814;
    --primary-2: #e95420;
    --accent-blue: #0078d7;
    --accent-amber: #f59e0b;
    --accent-green: #22c55e;
    --accent-purple: #a855f7;
    --danger: #ef4444;
    --success: #22c55e;
    --vb-blue: #2196f3;
    --vb-blue-dark: #0d47a1;
    --ubuntu-orange: #e95420;
    --ubuntu-aubergine: #772953;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Ubuntu", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(221, 72, 20, 0.08), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(33, 150, 243, 0.06), transparent 40%);
    background-attachment: fixed;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }

  /* Login */
  .login-wrap { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 240px;
    background: rgba(221, 72, 20, 0.25);
    border-radius: 50%;
    filter: blur(60px);
  }
  .login-logo {
    position: relative;
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ubuntu-orange), var(--vb-blue));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    overflow: hidden;
  }
  .login-logo::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent 60%);
  }
  .login-card h1 {
    position: relative;
    font-size: 26px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--ubuntu-orange), var(--vb-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .login-card p {
    position: relative;
    color: var(--fg-muted);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .input-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 12px;
    margin-bottom: 12px;
  }
  .input-row:focus-within { border-color: var(--primary); }
  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    padding: 12px 0;
    font-size: 15px;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.06);
    color: var(--fg);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,0.1); }
  .btn-primary {
    background: linear-gradient(135deg, var(--ubuntu-orange), var(--vb-blue));
    color: white;
    border: none;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-lg { padding: 14px 28px; font-size: 15px; width: 100%; }
  .btn-ghost { background: transparent; }
  .btn-ghost:hover { background: rgba(255,255,255,0.06); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-success { background: var(--success); color: white; border: none; }
  .btn-warning { background: var(--accent-amber); color: #1a1a1a; border: none; }

  /* Cards */
  .card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, rgba(20, 26, 36, 0.9), rgba(20, 26, 36, 0.4));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::before, .hero::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
  }
  .hero::before { top: -80px; right: -80px; width: 300px; height: 300px; background: rgba(221, 72, 20, 0.12); }
  .hero::after { bottom: -60px; left: -60px; width: 200px; height: 200px; background: rgba(33, 150, 243, 0.1); }
  .hero-content {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .hero h1 { font-size: 30px; margin-bottom: 8px; }
  .hero h1 span {
    background: linear-gradient(135deg, var(--ubuntu-orange), var(--vb-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p { color: var(--fg-muted); max-width: 520px; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(221, 72, 20, 0.12);
    color: var(--primary);
    border: 1px solid rgba(221, 72, 20, 0.3);
    margin-bottom: 12px;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .stat { text-align: center; min-width: 90px; }
  .stat-icon {
    width: 44px;
    height: 44px;
    margin: 0 auto 8px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .stat-value { font-size: 26px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--fg-muted); }

  /* Section head */
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section-head h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }

  /* Modules grid */
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .module-card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    text-align: left;
    width: 100%;
    color: var(--fg);
    font-family: inherit;
  }
  .module-card:hover {
    transform: translateY(-4px);
    border-color: var(--mod-color, var(--primary));
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
  }
  .module-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0.18;
    background: var(--mod-color, var(--primary));
  }
  .module-icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: rgba(255,255,255,0.08);
    margin-bottom: 14px;
    position: relative;
  }
  .module-card h3 { font-size: 17px; margin-bottom: 6px; }
  .module-card p { color: var(--fg-muted); font-size: 13px; margin-bottom: 16px; min-height: 38px; }
  .progress-bar { height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: var(--mod-color, var(--primary)); border-radius: 999px; transition: width 0.5s; }
  .module-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .module-footer .cta { color: var(--mod-color, var(--primary)); font-weight: 500; }

  /* Lesson items */
  .lesson-item {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
    color: var(--fg);
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .lesson-item:hover:not(.locked) { border-color: var(--primary); transform: translateY(-2px); }
  .lesson-item.locked { opacity: 0.5; cursor: not-allowed; }
  .lesson-item.completed { border-color: rgba(34, 197, 94, 0.3); }
  .lesson-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .lesson-info { flex: 1; }
  .lesson-tag { font-size: 11px; font-family: monospace; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .lesson-info h4 { font-size: 15px; margin: 4px 0; }
  .lesson-info p { color: var(--fg-muted); font-size: 13px; }

  /* Lesson content */
  .lesson-content section { margin-bottom: 22px; }
  .lesson-content h3 {
    font-size: 17px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lesson-content .num {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: white;
    background: var(--mod-color, var(--primary));
    flex-shrink: 0;
  }
  .lesson-content p {
    color: var(--fg-muted);
    padding-left: 38px;
    font-size: 14.5px;
  }
  .example-box {
    margin-left: 38px;
    margin-top: 8px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-size: 13px;
  }
  .example-box .ex-label { color: #f59e0b; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .example-box .ex-text { color: #fcd34d; }
  .tip-box {
    margin-left: 38px;
    margin-top: 8px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(34, 197, 94, 0.08);
    border: 1px solid rgba(34, 197, 94, 0.3);
    font-size: 13px;
  }
  .tip-box .tip-label { color: #22c55e; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .tip-box .tip-text { color: #86efac; }

  /* Code blocks */
  .code-block {
    margin-left: 38px;
    margin-top: 8px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #0a0e14;
    border: 1px solid #1e2b22;
    font-family: "SF Mono", "Monaco", "Consolas", monospace;
    font-size: 13px;
    color: #d1f7e0;
    overflow-x: auto;
  }
  .code-block .comment { color: #6b7280; }
  .code-block .prompt { color: var(--ubuntu-orange); }

  /* Quiz */
  .quiz-progress {
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .quiz-progress > div { height: 100%; background: var(--primary); transition: width 0.3s; }
  .quiz-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-muted); margin-bottom: 8px; }
  .quiz-question { font-size: 17px; font-weight: 600; margin-bottom: 18px; line-height: 1.5; }
  .quiz-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--primary); background: rgba(221, 72, 20, 0.05); }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
  .quiz-option.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
  .opt-letter {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .quiz-option.correct .opt-letter { background: var(--success); border-color: var(--success); color: white; }
  .quiz-option.wrong .opt-letter { background: var(--danger); border-color: var(--danger); color: white; }
  .quiz-explain {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    background: rgba(221, 72, 20, 0.05);
    border: 1px solid rgba(221, 72, 20, 0.2);
    font-size: 14px;
  }
  .quiz-explain .ex-title { font-weight: 600; margin-bottom: 4px; }

  /* Result */
  .result-card { text-align: center; padding: 40px 24px; }
  .result-icon {
    width: 80px; height: 80px;
    margin: 0 auto 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: rgba(34, 197, 94, 0.15);
  }
  .result-icon.fail { background: rgba(245, 158, 11, 0.15); }
  .result-card h3 { font-size: 24px; margin-bottom: 8px; }
  .result-pct { font-size: 42px; font-weight: 800; color: var(--primary); margin: 12px 0; }

  /* ===== VirtualBox Mockup ===== */
  .vb-window {
    background: #f0f0f0;
    border: 1px solid #999;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    color: #1a1a1a;
    overflow: hidden;
    font-size: 13px;
  }
  .vb-titlebar {
    background: linear-gradient(to bottom, #2c5d8f, #1a4570);
    color: white;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .vb-titlebar .vb-logo {
    width: 18px; height: 18px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--vb-blue-dark);
    font-size: 11px;
    font-weight: bold;
  }
  .vb-titlebar-text { flex: 1; }
  .vb-titlebar-buttons { display: flex; gap: 6px; }
  .vb-titlebar-buttons span {
    width: 18px; height: 18px;
    border-radius: 3px;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    cursor: pointer;
  }
  .vb-menubar {
    background: #e8e8e8;
    border-bottom: 1px solid #ccc;
    padding: 4px 10px;
    font-size: 12px;
    color: #333;
  }
  .vb-menubar span { margin-right: 12px; cursor: pointer; }
  .vb-menubar span:hover { color: var(--vb-blue); }
  .vb-toolbar {
    background: linear-gradient(to bottom, #fafafa, #e0e0e0);
    border-bottom: 1px solid #ccc;
    padding: 8px;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .vb-btn {
    background: linear-gradient(to bottom, #fafafa, #d4d4d4);
    border: 1px solid #aaa;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 11px;
    color: #333;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .vb-btn:hover { background: linear-gradient(to bottom, #e8f4fc, #b8d8e8); border-color: var(--vb-blue); }
  .vb-btn.primary { background: linear-gradient(to bottom, #4a90e2, #2c5d8f); color: white; border-color: #1a4570; }
  .vb-btn.primary:hover { background: linear-gradient(to bottom, #5aa0f2, #3c6d9f); }
  .vb-btn.danger { background: linear-gradient(to bottom, #f44336, #c62828); color: white; border-color: #b71c1c; }
  .vb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .vb-body {
    background: white;
    padding: 16px;
    min-height: 320px;
  }
  .vm-list {
    background: white;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px;
  }
  .vm-item {
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .vm-item:hover { background: #f0f7ff; }
  .vm-item.selected { background: #e0efff; border-color: var(--vb-blue); }
  .vm-icon { font-size: 24px; }
  .vm-info { flex: 1; }
  .vm-info .vm-name { font-weight: 500; color: #1a1a1a; }
  .vm-info .vm-state { font-size: 11px; color: #666; }
  .vm-details {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 12px;
    margin-top: 12px;
    font-size: 12px;
  }
  .vm-details h4 { color: #1a1a1a; font-size: 13px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #eee; }
  .vm-details .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    color: #444;
  }
  .vm-details .detail-row .label { color: #666; }
  .vm-empty {
    text-align: center;
    padding: 40px 20px;
    color: #888;
  }
  .vm-empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

  /* Modal dialog */
  .vb-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .vb-modal {
    background: #f0f0f0;
    border: 1px solid #999;
    border-radius: 8px;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 60px rgba(0,0,0,0.7);
  }
  .vb-modal .vb-modal-titlebar {
    background: linear-gradient(to bottom, #2c5d8f, #1a4570);
    color: white;
    padding: 8px 12px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .vb-modal-body {
    background: white;
    padding: 20px;
    overflow-y: auto;
    color: #1a1a1a;
  }
  .vb-modal-footer {
    background: #e8e8e8;
    border-top: 1px solid #ccc;
    padding: 10px 16px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; font-weight: 500; color: #333; margin-bottom: 4px; }
  .form-row input, .form-row select {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid #aaa;
    border-radius: 4px;
    font-size: 13px;
    background: white;
    color: #1a1a1a;
    font-family: inherit;
  }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--vb-blue); box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2); }
  .form-row .hint { font-size: 11px; color: #666; margin-top: 3px; }
  .form-row .error { font-size: 11px; color: var(--danger); margin-top: 3px; }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-row input[type=range] { flex: 1; }
  .slider-row .value {
    min-width: 60px;
    text-align: right;
    font-family: monospace;
    font-size: 13px;
    color: var(--vb-blue);
    font-weight: 600;
  }

  /* Wizard steps */
  .wizard-steps {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    padding: 10px;
    background: #fafafa;
    border-radius: 6px;
    border: 1px solid #eee;
  }
  .wizard-step {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: #888;
    padding: 4px;
    border-bottom: 2px solid transparent;
  }

          { heading: 'Definição', body: 'Virtualização é a técnica de criar uma representação virtual (abstrata) de um recurso computacional — uma máquina, disco, rede, CPU — de modo que múltiplos consumidores possam compartilhar o mesmo recurso físico de forma isolada. Na prática, permite rodar múltiplos sistemas operacionais simultaneamente em um único hardware físico.' },
          { heading: 'Por que virtualizar?', body: 'Antes da virtualização, servidores rodavam um SO por máquina, deixando CPU e memória subutilizadas (5–15%). A virtualização permite consolidar vários servidores em um hardware, reduzindo custos de energia, espaço e refrigeração. Além disso, oferece isolamento, snapshots (pontos de restauração), migração a quente e backups facilitados.', tip: 'Na disciplina de Fundamentos de Sistemas Operacionais da Unisinos, a Profª. Andriele Busatto do Carmo recomenda o uso de máquinas virtuais (VirtualBox + Linux Mint/Ubuntu) para as atividades práticas.' },

// ---------- ESTADO DO JOGO ----------
const STORAGE_KEY = 'vb-ubuntu-sim-v1';
function defaultState() {
  return {
    playerName: '',
    totalPoints: 0,
    modules: {
      virtualizacao: { completed: false, completedLessons: [] },
      'instalacao-vb': { completed: false, completedLessons: [] },
      'criacao-vm': { completed: false, completedLessons: [] },
      'instalacao-ubuntu': { completed: false, completedLessons: [] },
      'sim-vb': { completed: false, completedLessons: [] },
      'sim-ubuntu': { completed: false, completedLessons: [] }
    },
    achievements: []
  };
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    return Object.assign(defaultState(), s);
  } catch (e) { return defaultState(); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
const state = loadState();
function completeLesson(moduleId, lessonId, points) {
  const mod = state.modules[moduleId];
  if (mod.completedLessons.includes(lessonId)) return;
  mod.completedLessons.push(lessonId);
  state.totalPoints += points;
  saveState();
}
function completeModule(moduleId) {
  state.modules[moduleId].completed = true;
  saveState();
}
function addAchievement(name) {
  if (!state.achievements.includes(name)) {
    state.achievements.push(name);
    saveState();
  }
}
function resetProgress() {
  Object.assign(state, defaultState());
  saveState();
}

    </div>
  `;
  document.getElementById('startQuizBtn').addEventListener('click', () => renderQuiz(mod, lesson, lessonIdx, hasNext, 0, 0));
}

function renderQuiz(mod, lesson, lessonIdx, hasNext, currentQ, score) {
  const q = lesson.quiz[currentQ];
  const isLast = currentQ === lesson.quiz.length - 1;
  const progressPct = (currentQ / lesson.quiz.length) * 100;
  app.innerHTML = `
    <div class="flex-between mb-4">
      <button class="btn btn-ghost btn-sm" id="backBtn">← Voltar ao módulo</button>
      <div style="display: flex; gap: 8px;">
        <span class="badge" style="color: ${mod.color}; border-color: ${mod.color}66">${mod.title}</span>
        <span class="badge" style="background: rgba(255,255,255,0.06); color: var(--fg); border-color: var(--border)">📝 Quiz</span>
      </div>
    </div>
    <div class="card">
      <div class="quiz-meta">
        <span>Questão ${currentQ + 1} de ${lesson.quiz.length}</span>
        <span style="color: var(--primary); font-weight: 500;">Acertos: ${score}</span>
      </div>
      <div class="quiz-progress"><div style="width: ${progressPct}%"></div></div>
      <div class="quiz-question">${q.q}</div>
      <div id="options"></div>
      <div id="explain"></div>
      <div id="nextArea" style="display: none; margin-top: 16px; text-align: right;">
        <button class="btn btn-primary" id="nextBtn">${isLast ? 'Ver resultado' : 'Próxima questão'} →</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => renderModule(mod.id));

  const opts = document.getElementById('options');
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.innerHTML = `<div class="opt-letter">${String.fromCharCode(65 + idx)}</div><span>${opt}</span>`;
    btn.addEventListener('click', () => handleAnswer(idx));
    opts.appendChild(btn);
  });

  function handleAnswer(selectedIdx) {
    const buttons = opts.querySelectorAll('.quiz-option');
    buttons.forEach((b, i) => {
      b.disabled = true;
      if (i === q.correct) b.classList.add('correct');
      else if (i === selectedIdx) b.classList.add('wrong');
    });
    const correct = selectedIdx === q.correct;
    const newScore = correct ? score + 1 : score;
    document.getElementById('explain').innerHTML = `
      <div class="quiz-explain">
        <div class="ex-title">${correct ? '✓ Correto!' : '⚠ Não é a resposta certa.'}</div>
        <div class="text-muted">${q.explanation}</div>
      </div>
    `;
    document.getElementById('nextArea').style.display = 'block';
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (isLast) renderQuizResult(mod, lesson, lessonIdx, hasNext, newScore, lesson.quiz.length);
      else renderQuiz(mod, lesson, lessonIdx, hasNext, currentQ + 1, newScore);
    });
  }
}

function renderQuizResult(mod, lesson, lessonIdx, hasNext, score, total) {
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 60;
  if (passed) {
    completeLesson(mod.id, lesson.id, score * 10);
    if (!hasNext) {
      completeModule(mod.id);
      const achMap = {
        virtualizacao: 'Entende de Virtualização',
        'instalacao-vb': 'Instalador VirtualBox',
        'criacao-vm': 'Criador de VMs',
        'instalacao-ubuntu': 'Instalador Ubuntu'
      };
      if (achMap[mod.id]) addAchievement(achMap[mod.id]);
    }
  }
  app.innerHTML = `
    <div class="flex-between mb-4">
      <button class="btn btn-ghost btn-sm" id="backBtn">← Voltar ao módulo</button>
    </div>
    <div class="card result-card">
      <div class="result-icon ${passed ? '' : 'fail'}">${passed ? '🏆' : '📚'}</div>
      <h3>${passed ? 'Parabéns!' : 'Continue praticando!'}</h3>
      <p class="text-muted">Você acertou <strong style="color: var(--fg)">${score}</strong> de <strong style="color: var(--fg)">${total}</strong> questões</p>
      <div class="result-pct" style="${passed ? '' : 'color: var(--accent-amber)'}">${pct}%</div>
      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap;">
        <button class="btn" id="retryBtn">↻ Tentar novamente</button>
        ${hasNext ? '<button class="btn btn-primary" id="nextLessonBtn">Próxima lição →</button>' : '<button class="btn btn-primary" id="backModuleBtn">← Voltar ao módulo</button>'}
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => renderModule(mod.id));
  document.getElementById('retryBtn').addEventListener('click', () => renderQuiz(mod, lesson, lessonIdx, hasNext, 0, 0));
  if (hasNext) document.getElementById('nextLessonBtn').addEventListener('click', () => renderLesson(mod, lessonIdx + 1));
  else document.getElementById('backModuleBtn').addEventListener('click', () => renderModule(mod.id));
}

function updateVBStep() {
  const stepIdx = Math.min(simVBState.step, VB_STEPS.length - 1);
  const step = VB_STEPS[stepIdx];
  const title = document.getElementById('vbStepTitle');
  const hint = document.getElementById('vbStepHint');
  const num = document.getElementById('vbStepNum');
  if (title) title.textContent = `Passo ${stepIdx + 1}: ${step.title}`;
  if (hint) hint.textContent = step.hint;
  if (num) num.textContent = stepIdx + 1;

  // Se a VM existe mas não tem ISO, mostrar dica para montar
  if (simVBState.vms.length > 0 && simVBState.step === 2) {
    // Avança para step de ISO
    simVBState.step = 5;
    const s = VB_STEPS[5];
    if (title) title.textContent = `Passo 6: ${s.title}`;
    if (hint) hint.textContent = s.hint;
    if (num) num.textContent = '6';
  }

  // Verifica se completou tudo
  if (simVBState.vms.length > 0 && simVBState.vms[0].iso && simVBState.step === 6) {
    setTimeout(() => {
      // Avança o passo final - simula iniciar a VM
      simVBState.vms[0].state = 'Em execução';
      completeLesson('sim-vb', 'sim-complete', 100);
      addAchievement('Mestre do VirtualBox');
      completeModule('sim-vb');
      renderVBScreen();
      showVBCompletionModal();
    }, 500);
  }
}

function updateUbuntuStep() {
  const step = UBUNTU_STEPS[simUbuntuState.step];
  const title = document.getElementById('ubStepTitle');
  const hint = document.getElementById('ubStepHint');
  const num = document.getElementById('ubStepNum');
  if (title) title.textContent = `Passo ${simUbuntuState.step + 1}: ${step.title}`;
  if (hint) hint.textContent = step.hint;
  if (num) num.textContent = simUbuntuState.step + 1;
}

// ---------- UTIL ----------
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

// ---------- INIT ----------
render();
