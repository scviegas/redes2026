<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Simulator — Jogo Educativo de Sistemas Operacionais</title>
<style>
  :root {
    --bg: #0a0e14;
    --bg-card: rgba(20, 26, 36, 0.7);
    --bg-card-solid: #141a24;
    --fg: #e6edf3;
    --fg-muted: #8b949e;
    --border: #21262d;
    --primary: #10b981;
    --primary-2: #06b6d4;
    --accent-amber: #f59e0b;
    --accent-purple: #a855f7;
    --danger: #ef4444;
    --success: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(16, 185, 129, 0.08), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(6, 182, 212, 0.06), transparent 40%);
    background-attachment: fixed;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* Login screen */
  .login-wrap {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 240px;
    background: rgba(16, 185, 129, 0.2);
    border-radius: 50%;
    filter: blur(60px);
  }
  .login-logo {
    position: relative;
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .login-card h1 {
    position: relative;
    font-size: 32px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .login-card p {
    position: relative;
    color: var(--fg-muted);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .input-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 12px;
    margin-bottom: 12px;
  }
  .input-row:focus-within {
    border-color: var(--primary);
  }
  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    padding: 12px 0;
    font-size: 15px;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.06);
    color: var(--fg);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,0.1); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: white;
    border: none;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-lg { padding: 14px 28px; font-size: 15px; width: 100%; }
  .btn-ghost { background: transparent; }
  .btn-ghost:hover { background: rgba(255,255,255,0.06); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Cards */
  .card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }

  /* Hero / stats */
  .hero {
    background: linear-gradient(135deg, rgba(20, 26, 36, 0.9), rgba(20, 26, 36, 0.4));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::before, .hero::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
  }
  .hero::before {
    top: -80px; right: -80px;
    width: 300px; height: 300px;
    background: rgba(16, 185, 129, 0.1);
  }
  .hero::after {
    bottom: -60px; left: -60px;
    width: 200px; height: 200px;
    background: rgba(6, 182, 212, 0.08);
  }
  .hero-content {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .hero h1 {
    font-size: 32px;
    margin-bottom: 8px;
  }
  .hero h1 span {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p {
    color: var(--fg-muted);
    max-width: 500px;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(16, 185, 129, 0.1);
    color: var(--primary);
    border: 1px solid rgba(16, 185, 129, 0.3);
    margin-bottom: 12px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .stat {
    text-align: center;
    min-width: 90px;
  }
  .stat-icon {
    width: 44px;
    height: 44px;
    margin: 0 auto 8px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
  }
  .stat-label {
    font-size: 12px;
    color: var(--fg-muted);
  }

  /* Module grid */
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section-head h2 {
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .module-card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    text-align: left;
    width: 100%;
    color: var(--fg);
    font-family: inherit;
  }
  .module-card:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    box-shadow: 0 12px 30px rgba(16, 185, 129, 0.15);
  }
  .module-card::before {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0.15;
    background: var(--mod-color, var(--primary));
  }
  .module-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: rgba(255,255,255,0.08);
    margin-bottom: 14px;
    position: relative;
  }
  .module-card h3 {
    font-size: 17px;
    margin-bottom: 6px;
  }
  .module-card p {
    color: var(--fg-muted);
    font-size: 13px;
    margin-bottom: 16px;
    min-height: 38px;
  }
  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--mod-color, var(--primary));
    border-radius: 999px;
    transition: width 0.5s;
  }
  .module-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .module-footer .cta {
    color: var(--mod-color, var(--primary));
    font-weight: 500;
  }

  /* Lesson list */
  .lesson-item {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
    color: var(--fg);
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .lesson-item:hover:not(.locked) {
    border-color: var(--primary);
    transform: translateY(-2px);
  }
  .lesson-item.locked {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .lesson-item.completed {
    border-color: rgba(34, 197, 94, 0.3);
  }
  .lesson-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .lesson-info { flex: 1; }
  .lesson-tag {
    font-size: 11px;
    font-family: monospace;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .lesson-info h4 {
    font-size: 15px;
    margin: 4px 0;
  }
  .lesson-info p {
    color: var(--fg-muted);
    font-size: 13px;
  }

  /* Lesson content */
  .lesson-content section {
    margin-bottom: 22px;
  }
  .lesson-content h3 {
    font-size: 17px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lesson-content .num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: white;
    background: var(--mod-color, var(--primary));
    flex-shrink: 0;
  }
  .lesson-content p {
    color: var(--fg-muted);
    padding-left: 38px;
    font-size: 14.5px;
  }
  .example-box {
    margin-left: 38px;
    margin-top: 8px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-size: 13px;
  }
  .example-box .ex-label {
    color: #f59e0b;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .example-box .ex-text {
    color: #fcd34d;
  }

  /* Quiz */
  .quiz-progress {
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .quiz-progress > div {
    height: 100%;
    background: var(--primary);
    transition: width 0.3s;
  }
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--fg-muted);
    margin-bottom: 8px;
  }
  .quiz-question {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .quiz-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
  }
  .quiz-option:hover:not(:disabled) {
    border-color: var(--primary);
    background: rgba(16, 185, 129, 0.05);
  }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct {
    border-color: var(--success);
    background: rgba(34, 197, 94, 0.1);
  }
  .quiz-option.wrong {
    border-color: var(--danger);
    background: rgba(239, 68, 68, 0.1);
  }
  .opt-letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .quiz-option.correct .opt-letter {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }
  .quiz-option.wrong .opt-letter {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
  }
  .quiz-explain {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    background: rgba(16, 185, 129, 0.05);
    border: 1px solid rgba(16, 185, 129, 0.2);
    font-size: 14px;
  }
  .quiz-explain .ex-title {
    font-weight: 600;
    margin-bottom: 4px;
  }

  /* Result */
  .result-card { text-align: center; padding: 40px 24px; }
  .result-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: rgba(16, 185, 129, 0.15);
  }
  .result-icon.fail { background: rgba(245, 158, 11, 0.15); }
  .result-card h3 { font-size: 24px; margin-bottom: 8px; }
  .result-pct {
    font-size: 42px;
    font-weight: 800;
    color: var(--primary);
    margin: 12px 0;
  }

  /* Linux terminal */
  .terminal {
    background: #0a0e14;
    border: 1px solid #1e2b22;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }
  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #0f1419;
    border-bottom: 1px solid #1e2b22;
  }
  .term-dots { display: flex; gap: 6px; }
  .term-dots span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    opacity: 0.8;
  }
  .term-dots span:nth-child(1) { background: #ef4444; }
  .term-dots span:nth-child(2) { background: #eab308; }
  .term-dots span:nth-child(3) { background: #22c55e; }
  .term-title {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: rgba(16, 185, 129, 0.7);
    font-family: monospace;
  }
  .term-tag {
    font-size: 10px;
    color: rgba(16, 185, 129, 0.5);
    font-family: monospace;
  }
  .terminal-body {
    padding: 16px;
    height: 460px;
    overflow-y: auto;
    font-family: "SF Mono", "Monaco", "Menlo", "Consolas", monospace;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .terminal-body::-webkit-scrollbar { width: 8px; }
  .terminal-body::-webkit-scrollbar-track { background: rgba(16,185,129,0.04); }
  .terminal-body::-webkit-scrollbar-thumb { background: rgba(16,185,129,0.3); border-radius: 4px; }
  .term-line { white-space: pre-wrap; word-break: break-word; }
  .term-line.input { color: #d1f7e0; }
  .term-line.output { color: rgba(220, 252, 231, 0.9); }
  .term-line.error { color: #f87171; }
  .term-line.success { color: #fde047; font-weight: 600; }
  .term-line.system { color: #67e8f9; }
  .term-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .term-prompt {
    color: var(--primary);
    font-family: monospace;
    font-size: 13.5px;
    white-space: nowrap;
  }
  .term-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #d1f7e0;
    font-family: monospace;
    font-size: 13.5px;
    caret-color: var(--primary);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
    width: fit-content;
  }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab.active {
    background: rgba(255,255,255,0.08);
    color: var(--fg);
  }

  /* Command reference */
  .cmd-category { margin-bottom: 24px; }
  .cmd-cat-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 15px;
    font-weight: 600;
  }
  .cmd-cat-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .cmd-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .cmd-item {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
  }
  .cmd-item code {
    color: var(--primary);
    font-weight: 700;
    font-size: 13px;
  }
  .cmd-item .syntax {
    color: var(--fg-muted);
    font-size: 12px;
    margin-left: 6px;
  }
  .cmd-item p {
    color: var(--fg-muted);
    font-size: 12.5px;
    margin: 6px 0;
    line-height: 1.5;
  }
  .cmd-item .example {
    font-family: monospace;
    font-size: 11.5px;
    color: #6ee7b7;
    background: rgba(16, 185, 129, 0.06);
    padding: 3px 6px;
    border-radius: 4px;
    margin-top: 4px;
    display: block;
  }

  /* Achievements */
  .achievements-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .achievement {
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.1);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .hero-content { flex-direction: column; align-items: flex-start; }
    .stats { width: 100%; }
    .container { padding: 16px 12px 40px; }
    .hero h1 { font-size: 24px; }
    .lesson-content p { padding-left: 0; }
    .example-box { margin-left: 0; }
  }

  .hidden { display: none !important; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .mt-2 { margin-top: 8px; }
  .mt-4 { margin-top: 16px; }
  .mt-6 { margin-top: 24px; }
  .mb-4 { margin-bottom: 16px; }
  .text-muted { color: var(--fg-muted); }
  .text-sm { font-size: 13px; }
  .text-xs { font-size: 12px; }
  code.inline {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 13px;
    color: var(--primary);
  }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
/* ====================================================================
   OS SIMULATOR — Jogo Educativo de Sistemas Operacionais
   Arquivo HTML autossuficiente — abre em qualquer navegador
   ==================================================================== */

// ---------- DADOS: MÓDULOS, LIÇÕES, QUIZZES ----------
const MODULES = [
  {
    id: 'intro',
    title: 'Introdução aos Sistemas Operacionais',
    description: 'Conceitos iniciais: o que é um SO, suas funções e tipos',
    icon: '🧭',
    color: '#10b981',
    lessons: [
      {
        id: 'intro-1',
        title: 'O que é um Sistema Operacional?',
        icon: '💻',
        summary: 'Definição, propósito e o papel do SO como intermediário.',
        content: [
          { heading: 'Definição formal', body: 'Um Sistema Operacional (SO) é um software de sistema que atua como intermediário entre o hardware e os programas/aplicativos do usuário. Ele gerencia os recursos do computador (processador, memória, dispositivos de E/S) e fornece uma interface coerente e abstraída para que aplicações possam ser executadas sem precisar conhecer os detalhes físicos do hardware. Em essência, o SO transforma uma máquina física complexa em uma máquina virtual fácil de programar e usar.', example: 'Sem SO, um programa precisaria controlar diretamente o cabeçote de leitura do disco; com SO, basta executar fwrite() e o SO cuida do resto.' },
          { heading: 'Papel do SO: Gerente de recursos', body: 'O SO atua como um gerente de recursos: decide qual processo recebe CPU, quanto de memória cada aplicação pode usar, qual programa acessa o disco primeiro, como a rede é compartilhada. Em um sistema multitarefa, dezenas de processos "acham" que têm a máquina só para si graças à abstração criada pelo SO. Esse gerenciamento envolve políticas de escalonamento, alocação de memória, sincronização e proteção entre processos.' },

function normalizePath(path) {
  const parts = path.split('/').filter(Boolean);
  const result = [];
  for (const p of parts) {
    if (p === '.') continue;
    if (p === '..') { result.pop(); continue; }
    result.push(p);
  }
  return '/' + result.join('/');
}
function resolvePath(currentPath, target) {
  if (!target || target === '.') return currentPath;
  if (target === '..') {
    if (currentPath === '/') return '/';
    const parts = currentPath.split('/').filter(Boolean);
    parts.pop();
    return '/' + parts.join('/');
  }
  if (target === '~') return '/home/aluno';
  if (target.startsWith('~/')) return '/home/aluno/' + target.slice(2);
  if (target.startsWith('/')) return normalizePath(target);
  const base = currentPath === '/' ? '' : currentPath;
  return normalizePath(base + '/' + target);
}
function getNode(fs, path) {
  if (path === '/') return fs;
  const parts = path.split('/').filter(Boolean);
  let current = fs;
  for (const part of parts) {
    if (current.type !== 'dir' || !current.children || !current.children[part]) return null;
    current = current.children[part];
  }
  return current;
}
function setNode(fs, path, node) {
  const parts = path.split('/').filter(Boolean);
  if (parts.length === 0) return false;
  let current = fs;
  for (let i = 0; i < parts.length - 1; i++) {
    if (current.type !== 'dir' || !current.children || !current.children[parts[i]]) return false;
    current = current.children[parts[i]];
  }
  if (current.type !== 'dir' || !current.children) return false;
  current.children[parts[parts.length - 1]] = node;
  return true;
}
function removeNode(fs, path) {
  const parts = path.split('/').filter(Boolean);
  if (parts.length === 0) return null;
  let current = fs;
  for (let i = 0; i < parts.length - 1; i++) {
    if (current.type !== 'dir' || !current.children || !current.children[parts[i]]) return null;
    current = current.children[parts[i]];
  }
  if (current.type !== 'dir' || !current.children) return null;
  const name = parts[parts.length - 1];
  const node = current.children[name];
  if (!node) return null;
  delete current.children[name];
  return node;
}
function cloneFS(fs) { return JSON.parse(JSON.stringify(fs)); }

// ---------- ESTADO DO JOGO (localStorage) ----------
const STORAGE_KEY = 'os-simulator-html-v1';
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    return Object.assign({
      playerName: '',
      totalPoints: 0,
      modules: {
        intro: { completed: false, completedLessons: [] },
        structures: { completed: false, completedLessons: [] },
        virtualization: { completed: false, completedLessons: [] },
        linux: { completed: false, completedLessons: [] }
      },
      achievements: []
    }, s);
  } catch (e) {
    return {
      playerName: '',
      totalPoints: 0,
      modules: {
        intro: { completed: false, completedLessons: [] },
        structures: { completed: false, completedLessons: [] },
        virtualization: { completed: false, completedLessons: [] },
        linux: { completed: false, completedLessons: [] }
      },
      achievements: []
    };
  }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
const state = loadState();

function completeLesson(moduleId, lessonId, points) {
  const mod = state.modules[moduleId];
  if (mod.completedLessons.includes(lessonId)) return;
  mod.completedLessons.push(lessonId);
  state.totalPoints += points;
  saveState();
}
function completeModule(moduleId) {
  state.modules[moduleId].completed = true;
  saveState();
}
function addAchievement(name) {
  if (!state.achievements.includes(name)) {
    state.achievements.push(name);
    saveState();
  }
}
function resetProgress() {
  state.playerName = '';
  state.totalPoints = 0;
  state.modules = {
    intro: { completed: false, completedLessons: [] },
    structures: { completed: false, completedLessons: [] },
    virtualization: { completed: false, completedLessons: [] },
    linux: { completed: false, completedLessons: [] }
  };
  state.achievements = [];
  saveState();
}

function renderQuiz(mod, lesson, lessonIdx, hasNext, currentQ, score) {
  const q = lesson.quiz[currentQ];
  const isLast = currentQ === lesson.quiz.length - 1;
  const progressPct = ((currentQ) / lesson.quiz.length) * 100;

  app.innerHTML = `
    <div class="flex-between mb-4">
      <button class="btn btn-ghost btn-sm" id="backBtn">← Voltar ao módulo</button>
      <div style="display: flex; gap: 8px;">
        <span class="badge" style="color: ${mod.color}; border-color: ${mod.color}66">${mod.title}</span>
        <span class="badge" style="background: rgba(255,255,255,0.06); color: var(--fg); border-color: var(--border)">📝 Quiz</span>
      </div>
    </div>
    <div class="card">
      <div class="quiz-meta">
        <span>Questão ${currentQ + 1} de ${lesson.quiz.length}</span>
        <span style="color: var(--primary); font-weight: 500;">Acertos: ${score}</span>
      </div>
      <div class="quiz-progress"><div style="width: ${progressPct}%"></div></div>
      <div class="quiz-question">${q.q}</div>
      <div id="options"></div>
      <div id="explain"></div>
      <div id="nextArea" style="display: none; margin-top: 16px; text-align: right;">
        <button class="btn btn-primary" id="nextBtn">${isLast ? 'Ver resultado' : 'Próxima questão'} →</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => renderModule(mod.id));

  const opts = document.getElementById('options');
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.innerHTML = `<div class="opt-letter">${String.fromCharCode(65 + idx)}</div><span>${opt}</span>`;
    btn.addEventListener('click', () => handleAnswer(idx));
    opts.appendChild(btn);
  });

  function handleAnswer(selectedIdx) {
    const buttons = opts.querySelectorAll('.quiz-option');
    buttons.forEach((b, i) => {
      b.disabled = true;
      if (i === q.correct) b.classList.add('correct');
      else if (i === selectedIdx) b.classList.add('wrong');
    });
    const correct = selectedIdx === q.correct;
    const newScore = correct ? score + 1 : score;
    const explain = document.getElementById('explain');
    explain.innerHTML = `
      <div class="quiz-explain">
        <div class="ex-title">${correct ? '✓ Correto!' : '⚠ Não é a resposta certa.'}</div>
        <div class="text-muted">${q.explanation}</div>
      </div>
    `;
    document.getElementById('nextArea').style.display = 'block';
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (isLast) {
        renderQuizResult(mod, lesson, lessonIdx, hasNext, newScore, lesson.quiz.length);
      } else {
        renderQuiz(mod, lesson, lessonIdx, hasNext, currentQ + 1, newScore);
      }
    });
  }
}

function renderQuizResult(mod, lesson, lessonIdx, hasNext, score, total) {
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 60;

  // Marca lição como completa
  if (passed) {
    completeLesson(mod.id, lesson.id, score * 10);
    if (!hasNext) {
      completeModule(mod.id);
      const achMap = {
        intro: 'Conhecedor de SO',
        structures: 'Arquiteto de Kernels',
        virtualization: 'Mestre da Virtualização'
      };
      if (achMap[mod.id]) addAchievement(achMap[mod.id]);
    }
  }

  app.innerHTML = `
    <div class="flex-between mb-4">
      <button class="btn btn-ghost btn-sm" id="backBtn">← Voltar ao módulo</button>
    </div>
    <div class="card result-card">
      <div class="result-icon ${passed ? '' : 'fail'}">${passed ? '🏆' : '📚'}</div>
      <h3>${passed ? 'Parabéns!' : 'Continue praticando!'}</h3>
      <p class="text-muted">Você acertou <strong style="color: var(--fg)">${score}</strong> de <strong style="color: var(--fg)">${total}</strong> questões</p>
      <div class="result-pct" style="${passed ? '' : 'color: var(--accent-amber)'}">${pct}%</div>
      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap;">
        <button class="btn" id="retryBtn">↻ Tentar novamente</button>
        ${hasNext ? '<button class="btn btn-primary" id="nextLessonBtn">Próxima lição →</button>' : '<button class="btn btn-primary" id="backModuleBtn">← Voltar ao módulo</button>'}
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => renderModule(mod.id));
  document.getElementById('retryBtn').addEventListener('click', () => renderQuiz(mod, lesson, lessonIdx, hasNext, 0, 0));
  if (hasNext) {
    document.getElementById('nextLessonBtn').addEventListener('click', () => renderLesson(mod, lessonIdx + 1));
  } else {
    document.getElementById('backModuleBtn').addEventListener('click', () => renderModule(mod.id));
  }
}

function switchTab(tab) {

    renderTerminalTab();
  } else {

    renderGuideTab();
  }
}

        <div class="terminal-body" id="termBody">
          <div class="term-line system">SimulatorOS 1.0 - Terminal Linux Interativo. Digite "help" para ver comandos, "tutorial" para o tutorial guiado.</div>
          <div class="term-line system">Usuario: aluno | Home: /home/aluno</div>
        </div>
      </div>
      <div class="card" style="padding: 18px;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
          <span style="color: var(--accent-amber)">💡</span>
          <h3 style="font-size: 15px; font-weight: 600;">Como começar</h3>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="padding: 12px; border-radius: 8px; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);">
            <div style="font-weight: 600; color: #10b981; font-size: 13px; margin-bottom: 4px;">1. Tutorial guiado</div>
            <div class="text-sm text-muted">Digite <code class="inline">tutorial</code> no terminal para iniciar 10 desafios guiados.</div>
          </div>
          <div style="padding: 12px; border-radius: 8px; background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.2);">
            <div style="font-weight: 600; color: #06b6d4; font-size: 13px; margin-bottom: 4px;">2. Exploração livre</div>
            <div class="text-sm text-muted">Use qualquer comando. Digite <code class="inline">help</code> para ver todos os suportados.</div>
          </div>
          <div style="padding: 12px; border-radius: 8px; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);">
            <div style="font-weight: 600; color: #f59e0b; font-size: 13px; margin-bottom: 4px;">3. Dicas úteis</div>
            <ul class="text-sm text-muted" style="list-style: none; padding: 0;">
              <li>• Use ↑/↓ para navegar no histórico</li>
              <li>• <code class="inline">cd</code> sem argumentos volta ao home</li>
              <li>• <code class="inline">~</code> = /home/aluno</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  `;
  renderTerminalInput();
}

function renderTerminalInput() {
  const body = document.getElementById('termBody');
  const form = document.createElement('form');
  form.className = 'term-input-row';
  form.id = 'termForm';
  form.innerHTML = `
    <span class="term-prompt" id="termPrompt">${getPrompt()}</span>
    <input type="text" class="term-input" id="termInput" autocomplete="off" autocapitalize="off" spellcheck="false" />
  `;
  body.appendChild(form);
  document.getElementById('termTitle').textContent = `aluno@simulator: ${termState.cwd}`;
  const input = document.getElementById('termInput');
  input.focus();
  input.addEventListener('keydown', handleTermKey);
  form.addEventListener('submit', e => { e.preventDefault(); submitTerm(); });
  body.scrollTop = body.scrollHeight;
}

function getPrompt() {
  return `aluno@simulator:${termState.cwd}$`;
}

function handleTermKey(e) {
  const input = document.getElementById('termInput');
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (termState.history.length === 0) return;
    if (termState.historyIdx === -1) termState.historyIdx = termState.history.length - 1;
    else termState.historyIdx = Math.max(0, termState.historyIdx - 1);
    input.value = termState.history[termState.historyIdx];
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (termState.historyIdx === -1) return;
    termState.historyIdx++;
    if (termState.historyIdx >= termState.history.length) {
      termState.historyIdx = -1;
      input.value = '';
    } else {
      input.value = termState.history[termState.historyIdx];
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    autocompleteTerm();
  }
}

function autocompleteTerm() {
  const input = document.getElementById('termInput');
  const parts = input.value.split(/\s+/);
  const last = parts[parts.length - 1] || '';
  const dirPath = last.includes('/') ? resolvePath(termState.cwd, last) : termState.cwd;
  const node = getNode(termState.fs, dirPath || termState.cwd);
  if (node && node.type === 'dir' && node.children) {
    const prefix = last.includes('/') ? last.split('/').pop() : last;
    const matches = Object.keys(node.children).filter(n => n.startsWith(prefix));
    if (matches.length === 1) {
      parts[parts.length - 1] = last.includes('/')
        ? last.slice(0, last.lastIndexOf('/') + 1) + matches[0]
        : matches[0];
      input.value = parts.join(' ');
    }
  }
}

function termPrint(text, type = 'output') {
  const body = document.getElementById('termBody');
  const line = document.createElement('div');
  line.className = 'term-line ' + type;
  line.textContent = text;
  body.appendChild(line);
}

function termPrintHTML(html, type = 'output') {
  const body = document.getElementById('termBody');
  const line = document.createElement('div');
  line.className = 'term-line ' + type;
  line.innerHTML = html;
  body.appendChild(line);
}

function submitTerm() {
  const input = document.getElementById('termInput');
  const cmd = input.value;
  // Remove o form atual
  const form = document.getElementById('termForm');
  if (form) form.remove();
  // Mostra o prompt + comando como linha
  termPrint(`${getPrompt()} ${cmd}`, 'input');
  if (cmd.trim()) {
    termState.history.push(cmd);
    termState.historyIdx = -1;
    executeCommand(cmd);
  }
  renderTerminalInput();
}

function executeCommand(rawCmd) {
  const cmd = rawCmd.trim();
  if (!cmd) return;
  const parts = cmd.split(/\s+/);
  const c = parts[0];
  const args = parts.slice(1);

  let output = '';
  let sideEffect = null;
  let shouldClear = false;

  switch (c) {
    case 'pwd':
      output = termState.cwd;
      break;
    case 'cd': {
      const target = args[0] || '~';
      const path = resolvePath(termState.cwd, target);
      if (!path) { output = `cd: ${target}: arquivo ou diretorio inexistente`; termPrint(output, 'error'); return; }
      const node = getNode(termState.fs, path);
      if (!node) { output = `cd: ${target}: arquivo ou diretorio inexistente`; termPrint(output, 'error'); return; }
      if (node.type !== 'dir') { output = `cd: ${target}: nao e um diretorio`; termPrint(output, 'error'); return; }
      termState.cwd = path;
      break;
    }
    case 'ls': {
      const showLong = args.some(a => a === '-l' || a === '-la' || a === '-al');
      const showAll = args.some(a => a === '-a' || a === '-la' || a === '-al');
      const pathArg = args.find(a => !a.startsWith('-'));
      const targetPath = pathArg ? resolvePath(termState.cwd, pathArg) : termState.cwd;
      if (!targetPath) { output = `ls: nao foi possivel acessar`; break; }
      const node = getNode(termState.fs, targetPath);
      if (!node) { output = `ls: nao foi possivel acessar '${pathArg}': Arquivo ou diretorio inexistente`; break; }
      if (node.type === 'file') {
        output = showLong ? `${node.permissions} 1 ${node.owner} ${node.owner} ${String(node.size).padStart(6)} Jan  1 12:00 ${node.name}` : node.name;
      } else {
        const children = Object.values(node.children || {});
        const visible = showAll ? children : children.filter(ch => !ch.name.startsWith('.'));
        if (showLong) {
          output = visible.map(ch => `${ch.permissions} 1 ${ch.owner} ${ch.owner} ${String(ch.size).padStart(6)} Jan  1 12:00 ${ch.name}${ch.type === 'dir' ? '/' : ''}`).join('\n');
        } else {
          output = visible.map(ch => ch.type === 'dir' ? ch.name + '/' : ch.name).join('   ');
        }
      }
      break;
    }
    case 'cat': {
      if (args.length === 0) { output = 'cat: argumento ausente'; break; }
      const results = [];
      for (const arg of args) {
        const path = resolvePath(termState.cwd, arg);
        if (!path) { results.push(`cat: ${arg}: arquivo inexistente`); continue; }
        const node = getNode(termState.fs, path);
        if (!node) { results.push(`cat: ${arg}: arquivo inexistente`); continue; }
        if (node.type === 'dir') { results.push(`cat: ${arg}: e um diretorio`); continue; }
        results.push(node.content || '');
      }
      output = results.join('\n');
      break;
    }
    case 'echo': {
      const fullArg = args.join(' ');
      const redirMatch = fullArg.match(/^(.*?)\s*(>>|>)\s*(\S+)$/);
      if (redirMatch) {
        const [, textPart, op, filename] = redirMatch;
        let text = textPart.trim();
        if ((text.startsWith('"') && text.endsWith('"')) || (text.startsWith("'") && text.endsWith("'"))) text = text.slice(1, -1);
        const filePath = resolvePath(termState.cwd, filename);
        if (!filePath) { output = `echo: ${filename}: caminho invalido`; break; }
        const existing = getNode(termState.fs, filePath);
        const newContent = op === '>>' && existing && existing.type === 'file' ? (existing.content || '') + text + '\n' : text + '\n';
        const newNode = { name: filename.split('/').pop() || filename, type: 'file', content: newContent, permissions: '-rw-r--r--', owner: 'aluno', size: newContent.length };
        sideEffect = () => {
          const newFs = cloneFS(termState.fs);
          setNode(newFs, filePath, newNode);
          termState.fs = newFs;
        };
      } else {
        let text = fullArg;
        if ((text.startsWith('"') && text.endsWith('"')) || (text.startsWith("'") && text.endsWith("'"))) text = text.slice(1, -1);
        output = text;
      }
      break;
    }
    case 'grep': {
      if (args.length < 2) { output = 'uso: grep PADRAO ARQUIVO'; break; }
      const pattern = args[0];
      const filename = args[1];
      const path = resolvePath(termState.cwd, filename);
      if (!path) { output = `grep: ${filename}: arquivo inexistente`; break; }
      const node = getNode(termState.fs, path);
      if (!node) { output = `grep: ${filename}: arquivo inexistente`; break; }
      if (node.type !== 'file') { output = `grep: ${filename}: e um diretorio`; break; }
      const content = node.content || '';
      const linesArr = content.split('\n');
      const matches = linesArr.filter(l => l.includes(pattern));
      output = matches.length === 0 ? '' : matches.join('\n');
      break;
    }
    case 'head':
    case 'tail': {
      let n = 10;
      const filtered = [];
      for (let i = 0; i < args.length; i++) {
        if (args[i] === '-n' && args[i + 1]) { n = parseInt(args[i + 1], 10) || 10; i++; }
        else if (!args[i].startsWith('-')) filtered.push(args[i]);
      }
      if (filtered.length === 0) { output = `${c}: arquivo nao especificado`; break; }
      const path = resolvePath(termState.cwd, filtered[0]);
      if (!path) { output = `${c}: ${filtered[0]}: arquivo inexistente`; break; }
      const node = getNode(termState.fs, path);
      if (!node || node.type !== 'file') { output = `${c}: ${filtered[0]}: nao e um arquivo`; break; }
      const linesArr = (node.content || '').split('\n');
      output = (c === 'head' ? linesArr.slice(0, n) : linesArr.slice(-n)).join('\n');
      break;
    }
    case 'mkdir': {
      const recursive = args.includes('-p');
      const targets = args.filter(a => !a.startsWith('-'));
      if (targets.length === 0) { output = 'uso: mkdir [-p] DIRETORIO'; break; }
      sideEffect = () => {
        const newFs = cloneFS(termState.fs);
        for (const t of targets) {
          const path = resolvePath(termState.cwd, t);
          if (!path) continue;
          if (recursive) {
            const partsArr = path.split('/').filter(Boolean);
            let current = newFs;
            for (const part of partsArr) {
              if (!current.children) current.children = {};
              if (!current.children[part]) {
                current.children[part] = { name: part, type: 'dir', children: {}, permissions: 'drwxr-xr-x', owner: 'aluno', size: 4096 };
              }
              current = current.children[part];
            }
          } else {
            const parent = path.split('/').slice(0, -1).join('/') || '/';
            const parentNode = getNode(newFs, parent);
            if (!parentNode || parentNode.type !== 'dir') { termPrint(`mkdir: nao foi possivel criar o diretorio '${t}': Arquivo inexistente`, 'error'); continue; }
            const name = path.split('/').pop();
            if (parentNode.children[name]) { termPrint(`mkdir: nao foi possivel criar o diretorio '${t}': Arquivo existe`, 'error'); continue; }
            parentNode.children[name] = { name, type: 'dir', children: {}, permissions: 'drwxr-xr-x', owner: 'aluno', size: 4096 };
          }
        }
        termState.fs = newFs;
      };
      break;
    }
    case 'rmdir': {
      if (args.length === 0) { output = 'uso: rmdir DIRETORIO'; break; }
      sideEffect = () => {
        const newFs = cloneFS(termState.fs);
        for (const t of args) {
          const path = resolvePath(termState.cwd, t);
          if (!path) { termPrint(`rmdir: falhou ao remover '${t}': Arquivo inexistente`, 'error'); continue; }
          const node = getNode(newFs, path);
          if (!node || node.type !== 'dir') { termPrint(`rmdir: falhou ao remover '${t}': Nao e um diretorio`, 'error'); continue; }
          if (Object.keys(node.children || {}).length > 0) { termPrint(`rmdir: falhou ao remover '${t}': Diretorio nao vazio`, 'error'); continue; }
          removeNode(newFs, path);
        }
        termState.fs = newFs;
      };
      break;
    }
    case 'touch': {
      if (args.length === 0) { output = 'uso: touch ARQUIVO'; break; }
      sideEffect = () => {
        const newFs = cloneFS(termState.fs);
        for (const t of args) {
          const path = resolvePath(termState.cwd, t);
          if (!path) continue;
          if (getNode(newFs, path)) continue;
          const name = path.split('/').pop();
          setNode(newFs, path, { name, type: 'file', content: '', permissions: '-rw-r--r--', owner: 'aluno', size: 0 });
        }
        termState.fs = newFs;
      };
      break;
    }
    case 'rm': {
      const recursive = args.some(a => a === '-r' || a === '-rf' || a === '-fr');
      const force = args.some(a => a === '-f' || a === '-rf' || a === '-fr');
      const targets = args.filter(a => !a.startsWith('-'));
      if (targets.length === 0) { output = 'uso: rm [-r] [-f] ARQUIVO'; break; }
      sideEffect = () => {
        const newFs = cloneFS(termState.fs);
        for (const t of targets) {
          const path = resolvePath(termState.cwd, t);
          if (!path) { if (!force) termPrint(`rm: nao foi possivel remover '${t}': Arquivo inexistente`, 'error'); continue; }
          const node = getNode(newFs, path);
          if (!node) { if (!force) termPrint(`rm: nao foi possivel remover '${t}': Arquivo inexistente`, 'error'); continue; }
          if (node.type === 'dir' && !recursive) { termPrint(`rm: nao foi possivel remover '${t}': E um diretorio (use -r)`, 'error'); continue; }
          removeNode(newFs, path);
        }
        termState.fs = newFs;
      };
      break;
    }
    case 'cp': {
      const recursive = args.includes('-r');
      const targets = args.filter(a => !a.startsWith('-'));
      if (targets.length < 2) { output = 'uso: cp [-r] ORIGEM DESTINO'; break; }
      const [src, dst] = targets;
      sideEffect = () => {
        const newFs = cloneFS(termState.fs);
        const srcPath = resolvePath(termState.cwd, src);
        if (!srcPath) { termPrint(`cp: nao foi possivel stat '${src}': Arquivo inexistente`, 'error'); return; }
        const srcNode = getNode(newFs, srcPath);
        if (!srcNode) { termPrint(`cp: nao foi possivel stat '${src}': Arquivo inexistente`, 'error'); return; }
        if (srcNode.type === 'dir' && !recursive) { termPrint(`cp: -r nao especificado; omitindo diretorio '${src}'`, 'error'); return; }
        const cloneNode = (n, newName) => ({ ...JSON.parse(JSON.stringify(n)), name: newName });
        const dstPath = resolvePath(termState.cwd, dst);
        if (!dstPath) { termPrint(`cp: nao foi possivel criar '${dst}'`, 'error'); return; }
        const dstNode = getNode(newFs, dstPath);
        if (dstNode && dstNode.type === 'dir') {
          dstNode.children[srcNode.name] = cloneNode(srcNode, srcNode.name);
        } else {
          const finalName = dstPath.split('/').pop();
          setNode(newFs, dstPath, cloneNode(srcNode, finalName));
        }
        termState.fs = newFs;
      };
      break;
    }
    case 'mv': {
      const targets = args.filter(a => !a.startsWith('-'));
      if (targets.length < 2) { output = 'uso: mv ORIGEM DESTINO'; break; }
      const [src, dst] = targets;
      sideEffect = () => {
        const newFs = cloneFS(termState.fs);
        const srcPath = resolvePath(termState.cwd, src);
        if (!srcPath) { termPrint(`mv: nao foi possivel stat '${src}': Arquivo inexistente`, 'error'); return; }
        const srcNode = getNode(newFs, srcPath);
        if (!srcNode) { termPrint(`mv: nao foi possivel stat '${src}': Arquivo inexistente`, 'error'); return; }
        const cloneNode = (n, newName) => ({ ...JSON.parse(JSON.stringify(n)), name: newName });
        const dstPath = resolvePath(termState.cwd, dst);
        const dstNode = getNode(newFs, dstPath || '');
        if (dstNode && dstNode.type === 'dir') {
          dstNode.children[srcNode.name] = cloneNode(srcNode, srcNode.name);
        } else if (dstPath) {
          const finalName = dstPath.split('/').pop();
          setNode(newFs, dstPath, cloneNode(srcNode, finalName));
        }
        removeNode(newFs, srcPath);
        termState.fs = newFs;
      };
      break;
    }
    case 'chmod': {
      if (args.length < 2) { output = 'uso: chmod PERMISSOES ARQUIVO'; break; }
      const [mode, ...files] = args;
      sideEffect = () => {
        const newFs = cloneFS(termState.fs);
        for (const f of files) {
          const path = resolvePath(termState.cwd, f);
          if (!path) continue;
          const node = getNode(newFs, path);
          if (!node) { termPrint(`chmod: nao foi possivel acessar '${f}': Arquivo inexistente`, 'error'); continue; }
          let newPerms = node.permissions || (node.type === 'dir' ? 'drwxr-xr-x' : '-rw-r--r--');
          const permsArr = newPerms.split('');
          if (mode.startsWith('+') || mode.startsWith('-')) {
            const op = mode[0];
            const who = mode[1];
            const perm = mode[2];
            const whoIndex = who === 'u' ? 1 : who === 'g' ? 4 : who === 'o' ? 7 : -1;
            if (whoIndex > 0 && perm) {
              const permMap = { r: 0, w: 1, x: 2 };
              const permIdx = permMap[perm];
              if (permIdx !== undefined) {
                const target = whoIndex + permIdx;
                if (op === '+') permsArr[target] = perm;
                else permsArr[target] = '-';
              }
            }
            newPerms = permsArr.join('');
          } else if (/^\d{3,4}$/.test(mode)) {
            const m = mode.padStart(4, '0').slice(-4);
            const [, u, g, o] = m.split('').map(c => parseInt(c, 10));
            const typeChar = node.type === 'dir' ? 'd' : '-';
            const toPerms = n => (n & 4 ? 'r' : '-') + (n & 2 ? 'w' : '-') + (n & 1 ? 'x' : '-');
            newPerms = typeChar + toPerms(u) + toPerms(g) + toPerms(o);
          }
          node.permissions = newPerms;
        }
        termState.fs = newFs;
      };
      break;
    }
    case 'whoami':
      output = 'aluno';
      break;
    case 'date':
      output = new Date().toString();
      break;
    case 'uname':
      output = args.includes('-a') ? 'Linux simulator 5.15.0-simulator #1 SMP Thu Jan 1 12:00:00 UTC 2026 x86_64 GNU/Linux' : 'Linux';
      break;
    case 'clear':
      shouldClear = true;
      break;
    case 'history':
      output = termState.history.map((h, i) => `${i + 1}  ${h}`).join('\n');
      break;
    case 'help':
      output = COMMANDS.map(c => `${c.name.padEnd(10)}  ${c.description}`).join('\n');
      break;
    case 'tutorial':
      termState.tutorialActive = true;
      termState.tutorialStep = 0;
      termPrint('Tutorial iniciado! Siga as instrucoes abaixo.', 'success');
      const t0 = TUTORIALS[0];
      termPrint(`\n[Tutorial] Passo 1/${TUTORIALS.length}: ${t0.title}\n${t0.description}\nDica: ${t0.hint}`, 'system');
      return;
    default:
      termPrint(`comando nao encontrado: ${c}. Digite "help" para ver comandos disponiveis.`, 'error');
      return;
  }

  if (sideEffect) sideEffect();
  if (shouldClear) {
    document.getElementById('termBody').innerHTML = '';
    return;
  }
  if (output) termPrint(output, 'output');

  // Verifica progresso do tutorial
  if (termState.tutorialActive && termState.tutorialStep < TUTORIALS.length) {
    const step = TUTORIALS[termState.tutorialStep];
    if (step.validate(cmd, output, { cwd: termState.cwd })) {
      termPrint(`\n✓ Passo ${termState.tutorialStep + 1} concluido: ${step.title}`, 'success');
      const next = termState.tutorialStep + 1;
      if (next < TUTORIALS.length) {
        termState.tutorialStep = next;
        const nextStep = TUTORIALS[next];
        termPrint(`\n[Tutorial] Passo ${next + 1}/${TUTORIALS.length}: ${nextStep.title}\n${nextStep.description}\nDica: ${nextStep.hint}`, 'system');
      } else {
        termPrint('\n🎉 Tutorial completo! Voce dominou os comandos basicos de Linux.', 'success');
        termState.tutorialActive = false;
        completeLesson('linux', 'tutorial-complete', 100);
        addAchievement('Mestre do Terminal Linux');
        completeModule('linux');
      }
    }
  }
}

// ---------- UTIL ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

// ---------- INICIALIZAÇÃO ----------
render();
</script>
